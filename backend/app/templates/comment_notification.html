<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Comment</title>
</head>
<body style="font-family: Arial, sans-serif; padding:20px;">

<h2 style="color:#fd7e14;">💬 New Comment Added</h2>

<p>Hello <strong>{{ employee_name }}</strong>,</p>

<p>A new comment has been added to your ticket.</p>

<p><strong>Ticket:</strong> {{ ticket_title }}</p>

<p><strong>Comment:</strong></p>

<div style="background:#f4f4f4; padding:15px; border-left:4px solid #0d6efd;">
    {{ comment }}
</div>

<p>Please log in to HospitalAI to view the latest updates.</p>

<hr>

<small>HospitalAI Help Desk</small>

</body>
</html>
